# Každé 3 hodiny stáhne kalendář akcí ze systému Klasifikace a uloží ho
# do data/akce.json. Commit vznikne jen tehdy, když se akce opravdu změnily.
# Ručně jde spustit v záložce Actions → „Kalendář akcí“ → Run workflow.
name: Kalendář akcí

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalendar-akci
  cancel-in-progress: false

jobs:
  aktualizace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stáhnout a převést kalendář
        run: python3 tools/stahni_kalendar.py

      - name: Uložit změny
        run: |
          if git diff --quiet -- data/akce.json && git ls-files --error-unmatch data/akce.json >/dev/null 2>&1; then
            echo "Kalendář se nezměnil."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/akce.json
          git commit -m "Aktualizace kalendáře akcí"
          git push
