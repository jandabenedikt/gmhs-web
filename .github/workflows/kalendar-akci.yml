# Každé 3 hodiny stáhne kalendář akcí ze systému Klasifikace (data/akce.json)
# a sestaví společný kalendář ke stažení ze všech zdrojů (data/kalendar.ics).
# Spustí se i hned po nahrání nového plakátu (data/akce-plakat.json).
# Ručně jde spustit v záložce Actions → „Kalendář akcí“ → Run workflow.
name: Kalendář akcí

on:
  schedule:
    - cron: "17 */3 * * *"
  push:
    paths:
      - "data/akce-plakat.json"
      - "tools/stahni_kalendar.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalendar-akci
  cancel-in-progress: false

jobs:
  aktualizace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stáhnout kalendář a sestavit společný kalendář
        run: python3 tools/stahni_kalendar.py

      - name: Uložit změny
        run: |
          git add data/akce.json data/kalendar.ics
          if git diff --cached --quiet; then
            echo "Kalendář se nezměnil."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aktualizace kalendáře akcí"
          git pull --rebase
          git push
